<template>
    <lightning-card title="BPG Costing - Formula Dashboard" icon-name="standard:formula">
        <div class="slds-p-around_medium">

            <!-- Top Navigation Tabs -->
            <lightning-tabset active-tab-value={activeTab}>
                <lightning-tab label="Formulas" value="formulas" onactive={handleTabChange}>
                    <!-- Formula Filter Bar -->
                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-combobox
                                label="Filter By"
                                value={filterType}
                                options={filterOptions}
                                onchange={handleFilterTypeChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input
                                label="Search"
                                value={filterValue}
                                onchange={handleFilterValueChange}
                                placeholder="Enter search term...">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-combobox
                                label="Time Period"
                                value={timePeriod}
                                options={timePeriodOptions}
                                onchange={handleTimePeriodChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_3-of-12 slds-align_absolute-center" style="margin-top:24px">
                            <lightning-button
                                label="New Formula"
                                variant="brand"
                                icon-name="utility:add"
                                onclick={handleNewFormula}>
                            </lightning-button>
                        </div>
                    </div>

                    <!-- Formulas Grid -->
                    <template if:true={formulasLoaded}>
                        <lightning-datatable
                            key-field="Id"
                            data={formulas}
                            columns={formulaColumns}
                            onrowaction={handleFormulaRowAction}
                            sorted-by={sortedBy}
                            sorted-direction={sortedDirection}
                            onsort={handleSort}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                    <template if:false={formulasLoaded}>
                        <lightning-spinner alternative-text="Loading formulas..." size="medium"></lightning-spinner>
                    </template>
                </lightning-tab>

                <lightning-tab label="Material List" value="materials" onactive={handleTabChange}>
                    <!-- Material Filter & Add -->
                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                        <div class="slds-col slds-size_6-of-12">
                            <lightning-input
                                label="Search Materials"
                                value={materialSearch}
                                onchange={handleMaterialSearch}
                                placeholder="Type to filter...">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-combobox
                                label="Category"
                                value={materialCategoryFilter}
                                options={categoryOptions}
                                onchange={handleCategoryFilter}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_3-of-12 slds-align_absolute-center" style="margin-top:24px">
                            <lightning-button
                                label="Add Material"
                                variant="brand"
                                icon-name="utility:add"
                                onclick={handleAddMaterial}>
                            </lightning-button>
                        </div>
                    </div>

                    <template if:true={materialsLoaded}>
                        <lightning-datatable
                            key-field="Id"
                            data={filteredMaterials}
                            columns={materialColumns}
                            onrowaction={handleMaterialRowAction}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                    <template if:false={materialsLoaded}>
                        <lightning-spinner alternative-text="Loading materials..." size="medium"></lightning-spinner>
                    </template>
                </lightning-tab>

                <lightning-tab label="Sales Reps" value="salesreps" onactive={handleTabChange}>
                    <div class="slds-m-bottom_small">
                        <lightning-button
                            label="Add Sales Rep"
                            variant="brand"
                            icon-name="utility:add"
                            onclick={handleAddSalesRep}>
                        </lightning-button>
                    </div>
                    <template if:true={salesRepsLoaded}>
                        <lightning-datatable
                            key-field="Id"
                            data={salesReps}
                            columns={salesRepColumns}
                            onrowaction={handleSalesRepRowAction}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                </lightning-tab>

                <lightning-tab label="Settings" value="settings" onactive={handleTabChange}>
                    <div class="slds-grid slds-gutters slds-m-top_medium">
                        <div class="slds-col slds-size_4-of-12">
                            <lightning-input
                                type="number"
                                label="Freight Cost (%)"
                                value={freightPercentage}
                                step="0.01"
                                min="0"
                                max="100"
                                onchange={handleFreightChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_4-of-12">
                            <lightning-input
                                type="number"
                                label="New Price (Days)"
                                value={newPriceDays}
                                step="1"
                                onchange={handleNewPriceDaysChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_4-of-12">
                            <lightning-input
                                type="number"
                                label="Mid Price (Days)"
                                value={midPriceDays}
                                step="1"
                                onchange={handleMidPriceDaysChange}>
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-m-top_medium">
                        <lightning-button
                            label="Save Settings"
                            variant="brand"
                            onclick={handleSaveSettings}>
                        </lightning-button>
                    </div>
                </lightning-tab>
            </lightning-tabset>

        </div>

        <!-- Formula Editor Modal -->
        <template if:true={showFormulaEditor}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                onclick={closeFormulaEditor}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">{formulaEditorTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-formula-editor
                            formula-id={selectedFormulaId}
                            onclose={closeFormulaEditor}
                            onsave={handleFormulaSaved}>
                        </c-formula-editor>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Material Editor Modal -->
        <template if:true={showMaterialEditor}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                onclick={closeMaterialEditor}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">{materialEditorTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-material-manager
                            material-id={selectedMaterialId}
                            onclose={closeMaterialEditor}
                            onsave={handleMaterialSaved}>
                        </c-material-manager>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
